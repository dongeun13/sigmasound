<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SIGMA SOUND - 로컬 파일 및 클라우드 통합 뮤직 플레이어</title>
  <style>
    :root {
      --bg-base: #121212;
      --bg-elevated: #181818;
      --bg-highlight: #282828;
      --text-base: #ffffff;
      --text-subdued: #a7a7a7;
      --accent: #1db954;
      --accent-hover: #1ed760;
      --accent-soft: rgba(29, 185, 84, 0.18);
      --border-subtle: rgba(255, 255, 255, 0.08);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }

    body {
      background-color: #000000;
      color: var(--text-base);
      height: 100vh;
      height: 100dvh; /* 아이패드/모바일 뷰포트 잘림 현상 방지 */
      display: flex;
      flex-direction: column;
      overflow: hidden;
      user-select: none;
    }

    .app-container {
      display: flex;
      flex: 1;
      gap: 8px;
      padding: 8px 8px 0 8px;
      overflow: hidden;
      min-height: 0;
    }

    .sidebar {
      width: 270px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      flex-shrink: 0;
    }

    .nav-card, .library-card {
      background-color: var(--bg-base);
      border-radius: 8px;
      padding: 16px;
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 1.3rem;
      font-weight: 900;
      color: var(--text-base);
      margin-bottom: 18px;
      letter-spacing: 0.5px;
    }

    .logo-icon {
      width: 34px;
      height: 34px;
      background: linear-gradient(135deg, var(--accent), #0ea5e9);
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #000;
      font-weight: 900;
      font-size: 1.15rem;
    }

    .nav-item {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 10px 8px;
      color: var(--text-subdued);
      font-weight: 600;
      font-size: 0.95rem;
      border-radius: 6px;
      cursor: pointer;
      transition: color 0.2s, background-color 0.2s;
    }

    .nav-item:hover, .nav-item.active {
      color: var(--text-base);
      background-color: rgba(255, 255, 255, 0.05);
    }

    .library-card {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      min-height: 0;
    }

    .library-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 16px;
      color: var(--text-subdued);
      font-weight: 700;
      font-size: 0.95rem;
    }

    .icon-btn {
      background: transparent;
      border: none;
      color: var(--text-subdued);
      cursor: pointer;
      padding: 6px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s;
    }

    .icon-btn:hover {
      color: var(--text-base);
      background-color: var(--bg-highlight);
    }

    .library-list {
      flex: 1;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .library-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 8px;
      border-radius: 6px;
      cursor: pointer;
      transition: background-color 0.2s;
    }

    .library-item:hover, .library-item.active {
      background-color: var(--bg-highlight);
    }

    .library-thumb {
      width: 48px;
      height: 48px;
      border-radius: 4px;
      object-fit: cover;
      flex-shrink: 0;
      background: #282828;
    }

    .library-info {
      overflow: hidden;
    }

    .library-title {
      font-size: 0.95rem;
      font-weight: 700;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .library-sub {
      font-size: 0.78rem;
      color: var(--text-subdued);
      margin-top: 2px;
    }

    .main-view {
      flex: 1;
      background: linear-gradient(180deg, #222222 0%, var(--bg-base) 260px);
      border-radius: 8px;
      overflow-y: auto;
      position: relative;
      display: flex;
      flex-direction: column;
      min-height: 0;
    }

    .topbar {
      position: sticky;
      top: 0;
      z-index: 10;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 16px 24px;
      background-color: rgba(18, 18, 18, 0.85);
      backdrop-filter: blur(12px);
      gap: 12px;
      flex-wrap: wrap;
    }

    .search-box {
      display: flex;
      align-items: center;
      background-color: #242424;
      border-radius: 500px;
      padding: 8px 16px;
      width: 280px;
      max-width: 100%;
      gap: 10px;
      border: 1px solid transparent;
    }

    .search-box:focus-within {
      border-color: var(--accent);
    }

    .search-box input {
      background: transparent;
      border: none;
      color: #fff;
      font-size: 0.88rem;
      width: 100%;
      outline: none;
    }

    .topbar-actions {
      display: flex;
      gap: 12px;
      align-items: center;
      flex-wrap: wrap;
    }

    .theme-picker-box {
      display: flex;
      align-items: center;
      gap: 7px;
      background-color: #242424;
      padding: 6px 12px;
      border-radius: 500px;
      border: 1px solid var(--border-subtle);
    }

    .theme-label {
      font-size: 0.75rem;
      color: var(--text-subdued);
      font-weight: 600;
    }

    .color-swatch {
      width: 18px;
      height: 18px;
      border-radius: 50%;
      border: 2px solid transparent;
      cursor: pointer;
      transition: transform 0.15s, border-color 0.15s;
    }

    .color-swatch:hover {
      transform: scale(1.18);
    }

    .color-swatch.active {
      border-color: #ffffff;
      transform: scale(1.15);
    }

    .custom-color-input {
      width: 20px;
      height: 20px;
      border: none;
      background: transparent;
      cursor: pointer;
      padding: 0;
      border-radius: 50%;
    }

    .btn-primary {
      background-color: var(--accent);
      color: #000000;
      border: none;
      border-radius: 500px;
      padding: 10px 20px;
      font-weight: 700;
      font-size: 0.88rem;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      transition: transform 0.15s, background-color 0.2s;
    }

    .btn-primary:hover {
      background-color: var(--accent-hover);
      transform: scale(1.03);
    }

    .btn-secondary {
      background-color: rgba(255, 255, 255, 0.1);
      color: var(--text-base);
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 500px;
      padding: 9px 18px;
      font-weight: 600;
      font-size: 0.88rem;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      transition: background-color 0.2s;
    }

    .btn-secondary:hover {
      background-color: rgba(255, 255, 255, 0.18);
    }

    .content-padding {
      padding: 12px 24px 40px 24px;
    }

    .section-title {
      font-size: 1.45rem;
      font-weight: 700;
      margin-bottom: 18px;
    }

    .album-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(190px, 1fr));
      gap: 20px;
    }

    .album-card {
      background-color: var(--bg-elevated);
      padding: 16px;
      border-radius: 8px;
      cursor: pointer;
      transition: background-color 0.25s;
      position: relative;
    }

    .album-card:hover {
      background-color: var(--bg-highlight);
    }

    .album-cover-wrap {
      position: relative;
      width: 100%;
      aspect-ratio: 1 / 1;
      margin-bottom: 14px;
      border-radius: 6px;
      overflow: hidden;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5);
    }

    .album-cover-wrap img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .card-play-btn {
      position: absolute;
      bottom: 8px;
      right: 8px;
      width: 46px;
      height: 46px;
      border-radius: 50%;
      background-color: var(--accent);
      color: #000;
      border: none;
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      transform: translateY(8px);
      transition: all 0.25s ease;
      cursor: pointer;
    }

    .album-card:hover .card-play-btn {
      opacity: 1;
      transform: translateY(0);
    }

    .album-card-title {
      font-weight: 700;
      font-size: 1.05rem;
      margin-bottom: 6px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .album-card-meta {
      font-size: 0.85rem;
      color: var(--text-subdued);
    }

    .album-hero {
      display: flex;
      align-items: flex-end;
      gap: 24px;
      padding: 16px 0 28px 0;
    }

    .hero-cover {
      width: 210px;
      height: 210px;
      border-radius: 8px;
      object-fit: cover;
      box-shadow: 0 12px 32px rgba(0, 0, 0, 0.6);
      flex-shrink: 0;
    }

    .hero-info {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .hero-badge {
      font-size: 0.78rem;
      font-weight: 700;
      text-transform: uppercase;
      color: var(--accent);
    }

    .hero-title {
      font-size: 2.6rem;
      font-weight: 800;
      line-height: 1.1;
    }

    .hero-desc {
      color: var(--text-subdued);
      font-size: 0.9rem;
    }

    .hero-meta {
      font-size: 0.85rem;
      font-weight: 600;
      display: flex;
      gap: 8px;
    }

    .album-actions {
      display: flex;
      align-items: center;
      gap: 16px;
      margin-bottom: 24px;
    }

    .big-play-btn {
      width: 54px;
      height: 54px;
      border-radius: 50%;
      background-color: var(--accent);
      color: #000;
      border: none;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: transform 0.15s;
    }

    .big-play-btn:hover {
      transform: scale(1.05);
    }

    .danger-btn {
      background-color: rgba(255, 75, 75, 0.15);
      color: #ff5252;
      border: 1px solid rgba(255, 82, 82, 0.3);
      border-radius: 500px;
      padding: 9px 18px;
      font-weight: 600;
      font-size: 0.88rem;
      cursor: pointer;
    }

    .track-table {
      width: 100%;
      border-collapse: collapse;
    }

    .track-table th {
      text-align: left;
      color: var(--text-subdued);
      font-size: 0.78rem;
      font-weight: 500;
      padding: 8px 12px;
      border-bottom: 1px solid var(--border-subtle);
    }

    .track-row {
      border-radius: 6px;
      cursor: pointer;
      transition: background-color 0.15s;
    }

    .track-row:hover {
      background-color: rgba(255, 255, 255, 0.08);
    }

    .track-row.playing td {
      color: var(--accent);
    }

    .track-row td {
      padding: 12px;
      font-size: 0.92rem;
    }

    .track-num {
      width: 44px;
      color: var(--text-subdued);
      text-align: center;
    }

    /* 💡 트랙 제목 크기를 키우고 귀여운 느낌 강조 */
    .track-title-cell {
      font-weight: 700;
      font-size: 1.12rem;
      letter-spacing: -0.2px;
    }

    .format-badge, .cloud-badge, .lyrics-tag {
      display: inline-block;
      font-size: 0.68rem;
      font-weight: 700;
      padding: 2px 6px;
      border-radius: 4px;
      margin-left: 6px;
      vertical-align: middle;
      text-transform: uppercase;
    }
    .format-badge { background-color: var(--accent-soft); color: var(--accent); }
    .cloud-badge { background-color: rgba(59, 130, 246, 0.18); color: #3b82f6; }
    .lyrics-tag { background-color: rgba(255, 255, 255, 0.12); color: #e0e0e0; }

    .track-artist-sub {
      display: block;
      font-size: 0.82rem;
      color: var(--text-subdued);
      margin-top: 3px;
      font-weight: 500;
    }

    .track-duration {
      text-align: right;
      color: var(--text-subdued);
      width: 80px;
    }

    .lyrics-panel {
      width: 330px;
      background-color: var(--bg-base);
      border-radius: 8px;
      display: none;
      flex-direction: column;
      overflow: hidden;
      flex-shrink: 0;
      border: 1px solid var(--border-subtle);
    }

    .lyrics-panel.open {
      display: flex;
    }

    .lyrics-header {
      padding: 16px 18px;
      border-bottom: 1px solid var(--border-subtle);
      display: flex;
      align-items: center;
      justify-content: space-between;
      background-color: var(--bg-elevated);
    }

    .lyrics-header-title {
      font-weight: 700;
      font-size: 1rem;
      display: flex;
      align-items: center;
      gap: 8px;
      color: var(--accent);
    }

    .lyrics-song-meta {
      padding: 14px 18px;
      border-bottom: 1px solid var(--border-subtle);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      background: rgba(255, 255, 255, 0.02);
    }

    .lyrics-body {
      flex: 1;
      padding: 20px 18px;
      overflow-y: auto;
      font-size: 1.02rem;
      line-height: 1.85;
      color: #e5e5e5;
      white-space: pre-wrap;
    }

    .lyrics-empty {
      color: var(--text-subdued);
      font-size: 0.9rem;
      text-align: center;
      margin-top: 40px;
    }

    .lyrics-edit-area {
      width: 100%;
      height: 100%;
      min-height: 260px;
      background-color: #181818;
      border: 1px solid var(--accent);
      border-radius: 8px;
      padding: 12px;
      color: #ffffff;
      font-size: 0.95rem;
      outline: none;
      resize: none;
    }

    .player-bar {
      height: 88px;
      background-color: #000000;
      padding: 0 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-shrink: 0;
      border-top: 1px solid var(--border-subtle);
    }

    .now-playing {
      width: 30%;
      display: flex;
      align-items: center;
      gap: 14px;
      min-width: 180px;
    }

    .np-cover {
      width: 56px;
      height: 56px;
      border-radius: 6px;
      object-fit: cover;
      background: #282828;
    }

    .np-title {
      font-size: 0.98rem;
      font-weight: 700;
      margin-bottom: 3px;
    }

    .np-artist {
      font-size: 0.78rem;
      color: var(--text-subdued);
    }

    .player-controls {
      width: 40%;
      max-width: 600px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
    }

    .control-buttons {
      display: flex;
      align-items: center;
      gap: 20px;
    }

    .ctrl-btn {
      background: transparent;
      border: none;
      color: var(--text-subdued);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .ctrl-btn:hover, .ctrl-btn.active {
      color: var(--accent);
    }

    .play-pause-btn {
      width: 34px;
      height: 34px;
      border-radius: 50%;
      background-color: #ffffff;
      color: #000000;
      border: none;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }

    .progress-wrap {
      width: 100%;
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 0.72rem;
      color: var(--text-subdued);
    }

    input[type="range"] {
      -webkit-appearance: none;
      appearance: none;
      background: #4d4d4d;
      height: 4px;
      border-radius: 2px;
      outline: none;
      cursor: pointer;
    }

    input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: #ffffff;
    }

    .progress-bar { flex: 1; }

    .volume-controls {
      width: 30%;
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 12px;
      color: var(--text-subdued);
    }

    .lyrics-toggle-btn {
      background: rgba(255, 255, 255, 0.08);
      color: var(--text-subdued);
      border-radius: 500px;
      padding: 6px 12px;
      font-size: 0.78rem;
      font-weight: 700;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      border: 1px solid transparent;
    }

    .lyrics-toggle-btn:hover {
      color: #ffffff;
      background: rgba(255, 255, 255, 0.15);
    }

    .lyrics-toggle-btn.active {
      color: #000000;
      background-color: var(--accent);
    }

    .volume-slider { width: 90px; }

    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.78);
      backdrop-filter: blur(4px);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 100;
      padding: 16px;
    }

    .modal-backdrop.open { display: flex; }

    .modal {
      background-color: #222222;
      width: 100%;
      max-width: 580px;
      border-radius: 12px;
      padding: 24px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.7);
      max-height: 90vh;
      overflow-y: auto;
    }

    .modal-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 20px;
    }

    .modal-title { font-size: 1.25rem; font-weight: 700; }

    .form-group { margin-bottom: 16px; }

    .form-label {
      display: block;
      font-size: 0.85rem;
      font-weight: 600;
      margin-bottom: 6px;
      color: #e0e0e0;
    }

    .form-input, .form-textarea {
      width: 100%;
      background-color: #121212;
      border: 1px solid #3e3e3e;
      border-radius: 6px;
      padding: 10px 12px;
      color: #ffffff;
      font-size: 0.9rem;
      outline: none;
    }

    .form-input:focus, .form-textarea:focus { border-color: var(--accent); }

    .cover-setup-box {
      display: flex;
      gap: 14px;
      align-items: center;
      background: #181818;
      padding: 12px;
      border-radius: 8px;
      border: 1px solid #333;
    }

    .cover-preview-img {
      width: 84px;
      height: 84px;
      border-radius: 6px;
      object-fit: cover;
      background: #282828;
      flex-shrink: 0;
    }

    .cover-controls {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .file-dropzone {
      border: 2px dashed #444444;
      border-radius: 8px;
      padding: 18px 16px;
      text-align: center;
      cursor: pointer;
      background: #181818;
    }

    .file-dropzone:hover {
      border-color: var(--accent);
    }

    .format-pills {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 6px;
      margin-top: 8px;
    }

    .format-pill {
      font-size: 0.7rem;
      background: #2a2a2a;
      color: #cccccc;
      padding: 2px 8px;
      border-radius: 999px;
    }

    .selected-files-list {
      margin-top: 10px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      max-height: 280px;
      overflow-y: auto;
    }

    .selected-file-chip {
      background: #2a2a2a;
      padding: 10px;
      border-radius: 6px;
      font-size: 0.82rem;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .chip-top-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
    }

    .track-chip-left {
      display: flex;
      align-items: center;
      gap: 8px;
      overflow: hidden;
      flex: 1;
    }

    .track-order-num {
      background: #181818;
      color: var(--accent);
      font-weight: 700;
      font-size: 0.75rem;
      min-width: 22px;
      height: 22px;
      border-radius: 4px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }

    .track-chip-title {
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .track-chip-actions {
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .order-btn, .lyrics-mini-btn {
      background: #181818;
      border: 1px solid #3e3e3e;
      color: #e0e0e0;
      cursor: pointer;
      font-size: 0.75rem;
      height: 24px;
      border-radius: 4px;
      padding: 0 6px;
    }

    .order-btn:hover:not(:disabled), .lyrics-mini-btn:hover {
      background: var(--accent);
      color: #000;
      border-color: var(--accent);
    }

    .remove-file-btn {
      background: transparent;
      border: none;
      color: #ff6b6b;
      cursor: pointer;
      font-weight: 700;
    }

    .toast {
      position: fixed;
      bottom: 104px;
      left: 50%;
      transform: translateX(-50%) translateY(20px);
      background-color: var(--accent);
      color: #000;
      font-weight: 700;
      font-size: 0.88rem;
      padding: 10px 22px;
      border-radius: 500px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5);
      opacity: 0;
      pointer-events: none;
      transition: all 0.25s ease;
      z-index: 200;
    }

    .toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    @media (max-width: 900px) {
      .lyrics-panel {
        position: fixed;
        top: 8px;
        right: 8px;
        bottom: 96px;
        z-index: 50;
      }
    }

    @media (max-width: 768px) {
      .sidebar { display: none; }
      .album-hero { flex-direction: column; align-items: flex-start; }
      .volume-slider { display: none; }
      .now-playing { width: 45%; }
      .player-controls { width: 55%; }
    }
  </style>
</head>
<body>

  <div class="app-container">
    <aside class="sidebar">
      <div class="nav-card">
        <div class="logo">
          <div class="logo-icon">Σ</div>
          SIGMA SOUND
        </div>
        <div class="nav-item active" id="navHome" onclick="showHome()">홈</div>
        <div class="nav-item" onclick="openUploadModal()">새 앨범 만들기</div>
      </div>

      <div class="library-card">
        <div class="library-header">
          <span>내 라이브러리</span>
          <button class="icon-btn" onclick="openUploadModal()">+</button>
        </div>
        <div class="library-list" id="libraryList"></div>
      </div>
    </aside>

    <main class="main-view" id="mainView">
      <header class="topbar">
        <div class="search-box">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="#a7a7a7"><path d="M15.5 14h-.79l-.28-.27A6.471 6.471 0 0 0 16 9.5 6.5 6.5 0 1 0 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>
          <input type="text" id="searchInput" placeholder="앨범, 아티스트 또는 곡 검색..." oninput="handleSearch(this.value)" />
        </div>

        <div class="topbar-actions">
          <div class="theme-picker-box">
            <span class="theme-label">테마</span>
            <button class="color-swatch active" data-color="#1db954" style="background: #1db954;" onclick="setThemeColor('#1db954', this)"></button>
            <button class="color-swatch" data-color="#0ea5e9" style="background: #0ea5e9;" onclick="setThemeColor('#0ea5e9', this)"></button>
            <button class="color-swatch" data-color="#a855f7" style="background: #a855f7;" onclick="setThemeColor('#a855f7', this)"></button>
            <button class="color-swatch" data-color="#f43f5e" style="background: #f43f5e;" onclick="setThemeColor('#f43f5e', this)"></button>
            <input type="color" id="customThemeColor" class="custom-color-input" value="#1db954" oninput="setThemeColor(this.value, null)" />
          </div>

          <button class="btn-primary" onclick="openUploadModal()">새 앨범 만들기</button>
        </div>
      </header>

      <div class="content-padding" id="dynamicContent"></div>
    </main>

    <aside class="lyrics-panel" id="lyricsPanel">
      <div class="lyrics-header">
        <div class="lyrics-header-title">가사 보기</div>
        <button class="icon-btn" onclick="toggleLyricsPanel()">✕</button>
      </div>
      <div class="lyrics-song-meta" id="lyricsSongMeta">
        <div style="overflow: hidden;">
          <div id="lyricsTrackTitle" style="font-weight: 700; font-size: 0.92rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">재생 중인 곡 없음</div>
          <div id="lyricsTrackArtist" style="font-size: 0.78rem; color: var(--text-subdued); margin-top: 2px;">곡을 재생하면 가사가 표시됩니다</div>
        </div>
        <button class="btn-secondary" id="editLyricsBtn" style="padding: 5px 12px; font-size: 0.78rem; display: none;" onclick="toggleLyricsEditMode()">가사 편집</button>
      </div>
      <div class="lyrics-body" id="lyricsBody">
        <div class="lyrics-empty">재생 중인 곡이 없습니다.</div>
      </div>
    </aside>
  </div>

  <footer class="player-bar">
    <div class="now-playing">
      <img id="npCover" class="np-cover" src="" alt="Cover" />
      <div style="overflow: hidden;">
        <div class="np-title" id="npTitle" style="white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">재생 중인 곡 없음</div>
        <div class="np-artist" id="npArtist">SIGMA SOUND</div>
      </div>
    </div>

    <div class="player-controls">
      <div class="control-buttons">
        <button class="ctrl-btn" id="shuffleBtn" onclick="toggleShuffle()">🔀</button>
        <button class="ctrl-btn" onclick="prevTrack()">⏮</button>
        <button class="play-pause-btn" id="playPauseBtn" onclick="togglePlay()">
          <svg id="playIcon" width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
        </button>
        <button class="ctrl-btn" onclick="nextTrack()">⏭</button>
        <button class="ctrl-btn" id="repeatBtn" onclick="toggleRepeat()">🔁</button>
      </div>
      <div class="progress-wrap">
        <span id="currentTime">0:00</span>
        <input type="range" id="progressBar" class="progress-bar" min="0" max="100" value="0" oninput="seekTrack(this.value)" />
        <span id="totalTime">0:00</span>
      </div>
    </div>

    <div class="volume-controls">
      <button class="lyrics-toggle-btn" id="lyricsToggleBtn" onclick="toggleLyricsPanel()">가사</button>
      <input type="range" id="volumeSlider" class="volume-slider" min="0" max="1" step="0.01" value="0.8" oninput="setVolume(this.value)" />
    </div>
  </footer>

  <div class="modal-backdrop" id="uploadModal">
    <div class="modal">
      <div class="modal-header">
        <h2 class="modal-title">새 앨범 만들기</h2>
        <button class="icon-btn" onclick="closeUploadModal()">✕</button>
      </div>
      <form id="uploadForm" onsubmit="createAlbum(event)">
        <div class="form-group">
          <label class="form-label">앨범 표지 설정</label>
          <div class="cover-setup-box">
            <img id="coverPreviewImg" class="cover-preview-img" src="" alt="Cover Preview" />
            <div class="cover-controls">
              <button type="button" class="btn-secondary" style="padding: 6px 12px; font-size: 0.8rem;" onclick="document.getElementById('coverFileInput').click()">🖼️ 이미지 파일 선택</button>
              <input type="file" id="coverFileInput" accept="image/*" style="display: none;" onchange="handleCoverFileSelect(this.files)" />
              <input type="url" id="coverUrlInput" class="form-input" style="padding: 6px 10px; font-size: 0.8rem;" placeholder="또는 이미지 URL 입력" oninput="handleCoverUrlInput(this.value)" />
            </div>
          </div>
        </div>

        <div class="form-group">
          <label class="form-label">앨범 제목 *</label>
          <input type="text" id="albumTitleInput" class="form-input" placeholder="예: 플레이리스트" required oninput="updateDefaultCoverPreview()" />
        </div>
        <div class="form-group">
          <label class="form-label">아티스트 / 등록자 이름 *</label>
          <input type="text" id="albumArtistInput" class="form-input" placeholder="예: SIGMA" required />
        </div>
        <div class="form-group">
          <label class="form-label">앨범 소개</label>
          <textarea id="albumDescInput" class="form-textarea" rows="2" placeholder="설명 입력"></textarea>
        </div>

        <div class="form-group">
          <label class="form-label">모든 파일 업로드</label>
          <div class="file-dropzone" id="dropzone" onclick="document.getElementById('audioFileInput').click()">
            <div style="font-size: 0.88rem; font-weight: 600; color: #fff;">클릭하여 파일 선택 또는 여기에 드래그</div>
            <div class="format-pills">
              <span class="format-pill">모든 미디어 파일 지원 (MP3, WAV, M4A, AAC 등)</span>
            </div>
          </div>
          <input type="file" id="audioFileInput" accept="*" multiple style="display: none;" onchange="handleFileSelect(this.files)" />
        </div>

        <div class="form-group" id="trackOrderSection" style="display: none;">
          <label class="form-label">트랙 목록 및 순서 편집</label>
          <div class="selected-files-list" id="selectedFilesList"></div>
        </div>

        <div style="display: flex; justify-content: flex-end; gap: 10px; margin-top: 20px;">
          <button type="button" class="btn-secondary" onclick="closeUploadModal()">취소</button>
          <button type="submit" class="btn-primary">앨범 생성하기</button>
        </div>
      </form>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <script>
    function setThemeColor(hex, swatchEl) {
      document.documentElement.style.setProperty('--accent', hex);
      document.querySelectorAll('.color-swatch').forEach(btn => btn.classList.remove('active'));
      if (swatchEl) swatchEl.classList.add('active');
    }

    function createGradientCover(title, color1, color2) {
      const safeTitle = (title || 'SIGMA SOUND').replace(/[<>&'"]/g, '');
      const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="400" height="400" viewBox="0 0 400 400"><defs><linearGradient id="g" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="${color1}"/><stop offset="100%" stop-color="${color2}"/></linearGradient></defs><rect width="400" height="400" fill="url(#g)"/><text x="28" y="52" fill="rgba(255,255,255,0.75)" font-family="sans-serif" font-size="16" font-weight="800">SIGMA SOUND</text><text x="28" y="345" fill="#ffffff" font-family="sans-serif" font-size="30" font-weight="800">${safeTitle.slice(0, 14)}</text></svg>`;
      return 'data:image/svg+xml;charset=UTF-8,' + encodeURIComponent(svg);
    }

    const DEFAULT_ALBUMS = [
      {
        id: 'alb-1',
        title: 'Sigma Ambient Suite',
        artist: 'SIGMA SOUND',
        description: '기본 제공 앰비언트 앨범',
        cover: createGradientCover('Ambient Suite', '#1db954', '#0ea5e9'),
        tracks: [
          { id: 't-1', title: 'SoundHelix Wave 1', format: 'MP3', duration: 366, url: 'https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3', lyrics: '앰비언트 트랙 1' }
        ]
      }
    ];

    function getStoredAlbums() {
      try {
        const data = localStorage.getItem('sigma_sound_albums_v7');
        if (data) return JSON.parse(data);
      } catch(e) {}
      return DEFAULT_ALBUMS;
    }

    function saveStoredAlbums(list) {
      try { localStorage.setItem('sigma_sound_albums_v7', JSON.stringify(list)); } catch(e) {}
    }

    let albums = getStoredAlbums();
    let stagedTracks = [];
    let customCoverData = null;
    let currentView = 'home';
    let selectedAlbumId = null;
    let currentAlbum = null;
    let currentTrackIndex = -1;
    let isPlaying = false;
    let isShuffle = false;
    let isRepeat = false;

    const htmlAudio = new Audio();
    htmlAudio.volume = 0.8;

    htmlAudio.addEventListener('timeupdate', () => {
      if (htmlAudio.duration) {
        document.getElementById('progressBar').value = (htmlAudio.currentTime / htmlAudio.duration) * 100;
        document.getElementById('currentTime').textContent = formatTime(htmlAudio.currentTime);
        document.getElementById('totalTime').textContent = formatTime(htmlAudio.duration);
      }
    });

    htmlAudio.addEventListener('ended', () => {
      if (isRepeat) playAlbum(currentAlbum.id, currentTrackIndex);
      else nextTrack();
    });

    function formatTime(sec) {
      if (!sec || isNaN(sec)) return '0:00';
      const m = Math.floor(sec / 60);
      const s = Math.floor(sec % 60);
      return `${m}:${s < 10 ? '0' : ''}${s}`;
    }

    function showToast(msg) {
      const toast = document.getElementById('toast');
      toast.textContent = msg;
      toast.classList.add('show');
      setTimeout(() => toast.classList.remove('show'), 2500);
    }

    function renderLibrary() {
      const list = document.getElementById('libraryList');
      list.innerHTML = albums.map(alb => `
        <div class="library-item ${selectedAlbumId === alb.id && currentView === 'album' ? 'active' : ''}" onclick="openAlbum('${alb.id}')">
          <img class="library-thumb" src="${alb.cover}" alt="${alb.title}" />
          <div class="library-info">
            <div class="library-title">${alb.title}</div>
            <div class="library-sub">${alb.artist} • ${alb.tracks.length}곡</div>
          </div>
        </div>
      `).join('');
    }

    function showHome(filterText = '') {
      currentView = 'home';
      selectedAlbumId = null;
      document.getElementById('navHome').classList.add('active');
      renderLibrary();

      const filtered = albums.filter(a => a.title.toLowerCase().includes(filterText.toLowerCase()));
      document.getElementById('dynamicContent').innerHTML = `
        <h2 class="section-title">모든 앨범</h2>
        <div class="album-grid">
          ${filtered.map(alb => `
            <div class="album-card" onclick="openAlbum('${alb.id}')">
              <div class="album-cover-wrap">
                <img src="${alb.cover}" alt="${alb.title}" />
                <button class="card-play-btn" onclick="event.stopPropagation(); playAlbum('${alb.id}', 0)">▶</button>
              </div>
              <div class="album-card-title">${alb.title}</div>
              <div class="album-card-meta">${alb.artist} • ${alb.tracks.length}곡</div>
            </div>
          `).join('')}
        </div>
      `;
    }

    function handleSearch(val) { showHome(val); }

    function openAlbum(albumId) {
      const alb = albums.find(a => a.id === albumId);
      if (!alb) return;
      currentView = 'album';
      selectedAlbumId = albumId;
      document.getElementById('navHome').classList.remove('active');
      renderLibrary();

      document.getElementById('dynamicContent').innerHTML = `
        <div class="album-hero">
          <img class="hero-cover" src="${alb.cover}" alt="${alb.title}" />
          <div class="hero-info">
            <span class="hero-badge">SIGMA ALBUM</span>
            <h1 class="hero-title">${alb.title}</h1>
            <p class="hero-desc">${alb.description || ''}</p>
            <div class="hero-meta"><span>${alb.artist}</span><span>•</span><span>총 ${alb.tracks.length}곡</span></div>
          </div>
        </div>
        <div class="album-actions">
          <button class="big-play-btn" onclick="playAlbum('${alb.id}', 0)">▶</button>
          <button class="danger-btn" onclick="deleteAlbum('${alb.id}')">앨범 삭제</button>
        </div>
        <table class="track-table">
          <thead><tr><th class="track-num">#</th><th>제목</th><th style="text-align: right;">시간</th></tr></thead>
          <tbody>
            ${alb.tracks.map((tr, idx) => `
              <tr class="track-row ${currentAlbum?.id === alb.id && currentTrackIndex === idx ? 'playing' : ''}" onclick="playAlbum('${alb.id}', ${idx})">
                <td class="track-num">${idx + 1}</td>
                <td class="track-title-cell">${tr.title} <span class="format-badge">${tr.format}</span></td>
                <td class="track-duration">${formatTime(tr.duration)}</td>
              </tr>
            `).join('')}
          </tbody>
        </table>
      `;
    }

    function deleteAlbum(albumId) {
      if (confirm('앨범을 삭제하시겠습니까?')) {
        albums = albums.filter(a => a.id !== albumId);
        saveStoredAlbums(albums);
        renderLibrary();
        showHome();
      }
    }

    function playAlbum(albumId, trackIndex) {
      const alb = albums.find(a => a.id === albumId);
      if (!alb || !alb.tracks[trackIndex]) return;
      currentAlbum = alb;
      currentTrackIndex = trackIndex;
      const track = alb.tracks[trackIndex];

      document.getElementById('npCover').src = alb.cover;
      document.getElementById('npTitle').textContent = track.title;
      document.getElementById('npArtist').textContent = alb.artist;

      htmlAudio.src = track.data || track.url;
      htmlAudio.play().catch(() => {});
      isPlaying = true;
      updatePlayPauseIcon();
      renderLyricsPanel();
      if (currentView === 'album') openAlbum(albumId);
    }

    function togglePlay() {
      if (!currentAlbum && albums.length > 0) { playAlbum(albums[0].id, 0); return; }
      if (isPlaying) { isPlaying = false; htmlAudio.pause(); }
      else { isPlaying = true; htmlAudio.play(); }
      updatePlayPauseIcon();
    }

    function updatePlayPauseIcon() {
      document.getElementById('playIcon').innerHTML = isPlaying ? '<path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/>' : '<path d="M8 5v14l11-7z"/>';
    }

    function nextTrack() {
      if (!currentAlbum) return;
      playAlbum(currentAlbum.id, (currentTrackIndex + 1) % currentAlbum.tracks.length);
    }

    function prevTrack() {
      if (!currentAlbum) return;
      playAlbum(currentAlbum.id, (currentTrackIndex - 1 + currentAlbum.tracks.length) % currentAlbum.tracks.length);
    }

    function seekTrack(pct) {
      if (htmlAudio.duration) htmlAudio.currentTime = (pct / 100) * htmlAudio.duration;
    }

    function setVolume(val) { htmlAudio.volume = val; }
    function toggleShuffle() { isShuffle = !isShuffle; document.getElementById('shuffleBtn').classList.toggle('active', isShuffle); }
    function toggleRepeat() { isRepeat = !isRepeat; document.getElementById('repeatBtn').classList.toggle('active', isRepeat); }

    function toggleLyricsPanel() {
      document.getElementById('lyricsPanel').classList.toggle('open');
      document.getElementById('lyricsToggleBtn').classList.toggle('active');
      renderLyricsPanel();
    }

    function renderLyricsPanel() {
      const titleEl = document.getElementById('lyricsTrackTitle');
      const artistEl = document.getElementById('lyricsTrackArtist');
      const bodyEl = document.getElementById('lyricsBody');
      if (!currentAlbum || currentTrackIndex < 0) {
        titleEl.textContent = '재생 중인 곡 없음';
        bodyEl.innerHTML = '<div class="lyrics-empty">재생 중인 곡이 없습니다.</div>';
        return;
      }
      const track = currentAlbum.tracks[currentTrackIndex];
      titleEl.textContent = track.title;
      artistEl.textContent = currentAlbum.artist;
      bodyEl.innerHTML = `<div>${track.lyrics || '등록된 가사가 없습니다.'}</div>`;
    }

    function openUploadModal() {
      stagedTracks = [];
      customCoverData = null;
      updateDefaultCoverPreview();
      renderStagedFiles();
      document.getElementById('uploadModal').classList.add('open');
    }

    function closeUploadModal() {
      document.getElementById('uploadModal').classList.remove('open');
      document.getElementById('uploadForm').reset();
    }

    function updateDefaultCoverPreview() {
      if (customCoverData) return;
      const title = document.getElementById('albumTitleInput').value.trim() || 'SIGMA SOUND';
      document.getElementById('coverPreviewImg').src = createGradientCover(title, '#1db954', '#0ea5e9');
    }

    function handleCoverFileSelect(files) {
      if (!files[0]) return;
      const reader = new FileReader();
      reader.onload = e => {
        customCoverData = e.target.result;
        document.getElementById('coverPreviewImg').src = customCoverData;
      };
      reader.readAsDataURL(files[0]);
    }

    function handleCoverUrlInput(url) {
      customCoverData = url.trim() || null;
      if (customCoverData) document.getElementById('coverPreviewImg').src = customCoverData;
      else updateDefaultCoverPreview();
    }

    function handleFileSelect(files) {
      Array.from(files).forEach(file => {
        const reader = new FileReader();
        reader.onload = e => {
          stagedTracks.push({
            title: file.name.replace(/\.[^/.]+$/, ""),
            format: file.name.split('.').pop().toUpperCase() || 'FILE',
            duration: 180,
            data: e.target.result,
            lyrics: ''
          });
          renderStagedFiles();
        };
        reader.readAsDataURL(file);
      });
    }

    function renderStagedFiles() {
      const section = document.getElementById('trackOrderSection');
      const container = document.getElementById('selectedFilesList');
      if (stagedTracks.length === 0) { section.style.display = 'none'; return; }
      section.style.display = 'block';
      container.innerHTML = stagedTracks.map((tr, idx) => `
        <div class="selected-file-chip">
          <div class="chip-top-row">
            <div class="track-chip-left">
              <span class="track-order-num">${idx + 1}</span>
              <span class="track-chip-title">${tr.title}</span>
            </div>
            <div class="track-chip-actions">
              <button type="button" class="order-btn" onclick="moveTrack(${idx}, -1)" ${idx === 0 ? 'disabled' : ''}>▲</button>
              <button type="button" class="order-btn" onclick="moveTrack(${idx}, 1)" ${idx === stagedTracks.length - 1 ? 'disabled' : ''}>▼</button>
              <button type="button" class="remove-file-btn" onclick="removeStaged(${idx})">✕</button>
            </div>
          </div>
        </div>
      `).join('');
    }

    function moveTrack(idx, dir) {
      const target = idx + dir;
      if (target < 0 || target >= stagedTracks.length) return;
      const temp = stagedTracks[idx];
      stagedTracks[idx] = stagedTracks[target];
      stagedTracks[target] = temp;
      renderStagedFiles();
    }

    function removeStaged(idx) {
      stagedTracks.splice(idx, 1);
      renderStagedFiles();
    }

    function createAlbum(e) {
      e.preventDefault();
      const title = document.getElementById('albumTitleInput').value.trim();
      const artist = document.getElementById('albumArtistInput').value.trim();
      if (stagedTracks.length === 0) { alert('파일을 추가해주세요.'); return; }

      const newAlbum = {
        id: `alb-${Date.now()}`,
        title,
        artist,
        description: document.getElementById('albumDescInput').value.trim(),
        cover: customCoverData || createGradientCover(title, '#1db954', '#0ea5e9'),
        tracks: stagedTracks.map((t, idx) => ({ id: `tr-${idx}`, title: t.title, format: t.format, duration: t.duration, data: t.data, lyrics: t.lyrics }))
      };

      albums.unshift(newAlbum);
      saveStoredAlbums(albums);
      closeUploadModal();
      renderLibrary();
      openAlbum(newAlbum.id);
      showToast('앨범이 생성되었습니다!');
    }

    renderLibrary();
    showHome();
  </script>
</body>
</html>
